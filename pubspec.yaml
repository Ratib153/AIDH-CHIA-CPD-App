name: aidh_chia_cpd_app
description: CHIA CPD tracker frontend prototype in Flutter.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  excel: ^4.0.6
  file_saver: ^0.2.14
  mobile_scanner: ^5.2.3
  path: ^1.9.0
  pdf: ^3.11.1
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.3
  sqflite: ^2.3.0
  url_launcher: ^6.3.1
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/chia_logo.png

# Regenerate launcher icons: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/app_icon/icon.png
  # Lower inset = larger logo on Android adaptive icon (default 16 shrinks it).
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/app_icon/icon.png
    background_color: "#0082C8"
    theme_color: "#0082C8"
  windows:
    generate: true
    image_path: assets/app_icon/icon.png
  macos:
    generate: true
    image_path: assets/app_icon/icon.png
